<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("cz-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CZ Planner</title>
<meta name="theme-color" content="#14232C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CZ Planner">
<link rel="icon" type="image/png" sizes="32x32" href="../training/icons/favicon-32.png">
<link rel="apple-touch-icon" href="../training/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" defer></script>
<style>
/* CZ Planner: ganze Woche planen – Schlaf, Weg (Zug, Bus, Velo), Schule/Arbeit, Training, Lernen, Freizeit, Essen */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14232C; --muted:#5A6A73; --line:#D8E0E5;
  --accent:#1D63C9; --accent-soft:#E3ECFA; --warn:#C2412D; --ok:#2E8B57;
  --k-schlaf:#5B4FC2; --k-schlaf-bg:#ECEAFB;
  --k-weg:#5A6A73;   --k-weg-bg:#E9EEF1;
  --k-schule:#1D63C9; --k-schule-bg:#E3ECFA;
  --k-train:#C2412D; --k-train-bg:#FBE4DF;
  --k-lernen:#A86412; --k-lernen-bg:#FAEFD9;
  --k-frei:#3B7A1E;  --k-frei-bg:#E6F2DC;
  --k-essen:#0E7C6B; --k-essen-bg:#DDF3EE;
  --k-rec:#8A3E9E;   --k-rec-bg:#F3E6F6;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171C; --surface:#172229; --ink:#E6EDF1; --muted:#97A7B0; --line:#2A3943;
  --accent:#6EA4F2; --accent-soft:#1B2D46; --warn:#F08A77; --ok:#4CC383;
  --k-schlaf:#B0A8F2; --k-schlaf-bg:#262244; --k-weg:#A9B6BE; --k-weg-bg:#22303A;
  --k-schule:#6EA4F2; --k-schule-bg:#1B2D46; --k-train:#F08A77; --k-train-bg:#3D211C;
  --k-lernen:#E3AE5B; --k-lernen-bg:#3A2D17; --k-frei:#8FCB6B; --k-frei-bg:#1F3318;
  --k-essen:#5FD1BC; --k-essen-bg:#14332E; --k-rec:#D59BE3; --k-rec-bg:#33203A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171C; --surface:#172229; --ink:#E6EDF1; --muted:#97A7B0; --line:#2A3943;
  --accent:#6EA4F2; --accent-soft:#1B2D46; --warn:#F08A77; --ok:#4CC383;
  --k-schlaf:#B0A8F2; --k-schlaf-bg:#262244; --k-weg:#A9B6BE; --k-weg-bg:#22303A;
  --k-schule:#6EA4F2; --k-schule-bg:#1B2D46; --k-train:#F08A77; --k-train-bg:#3D211C;
  --k-lernen:#E3AE5B; --k-lernen-bg:#3A2D17; --k-frei:#8FCB6B; --k-frei-bg:#1F3318;
  --k-essen:#5FD1BC; --k-essen-bg:#14332E; --k-rec:#D59BE3; --k-rec-bg:#33203A; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.nav a,.nav span{padding:6px 10px;border-radius:9px;font-weight:600;font-size:.88rem;text-decoration:none;color:var(--ink)}
.nav span{background:var(--ink);color:var(--surface)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;min-width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.weekbar{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.weekbar .lbl{flex:1;text-align:center}
.weekbar .lbl b{font-family:var(--display);font-size:1.25rem;display:block;line-height:1.1}
.weekbar .lbl span{font-size:.8rem;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{border:0;background:none;border-radius:9px;padding:7px;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tplnote{font-size:.85rem;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:0 0 10px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:14px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px 5px;text-align:center;min-width:0}
.day b{display:block;font-size:.85rem}
.day em{display:block;font-style:normal;font-size:.72rem;color:var(--muted)}
.day[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day.today em{color:var(--accent);font-weight:600}
.strip{position:relative;height:46px;margin-top:4px;border-radius:5px;background:var(--bg);overflow:hidden}
.strip i{position:absolute;left:2px;right:2px;border-radius:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.dhead h2{font-family:var(--display);font-size:1.5rem;margin:0;line-height:1.1}
.dtype{display:inline-block;margin-top:4px;font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--k-train-bg);color:var(--k-train)}
.dtype.leicht{background:var(--k-frei-bg);color:var(--k-frei)}
.sw{display:flex;align-items:center;gap:7px;font-size:.85rem;color:var(--muted);white-space:nowrap;cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--k-essen)}
.next{border-radius:12px;background:var(--accent-soft);padding:9px 12px;margin:0 0 10px;font-size:.92rem}
.next b{font-weight:600}
.row{display:grid;grid-template-columns:46px minmax(0,1fr);gap:8px;align-items:start;margin-bottom:6px;position:relative}
.tm{font-size:.82rem;color:var(--muted);padding-top:9px;font-variant-numeric:tabular-nums}
.blk{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--c);background:var(--cbg);color:var(--ink);border-radius:0 10px 10px 0;padding:8px 11px;position:relative}
.blk.c-essen{padding:6px 11px}
.blk .t{font-weight:600;display:flex;align-items:center;gap:6px}
.blk .s{display:block;font-size:.8rem;color:var(--muted)}
.blk .go{font-size:.8rem;color:var(--c);font-weight:600}
.blk.done .t::after{content:"erledigt";font-size:.72rem;font-weight:600;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:0 7px;margin-left:auto}
.sub{display:block;margin:6px 0 0;border-radius:7px;padding:4px 8px;font-size:.82rem;background:var(--k-essen-bg);color:var(--ink);border:0;text-align:left;width:100%;border-left:3px solid var(--k-essen)}
.edit{position:absolute;right:6px;top:6px;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:1rem}
.now{height:0;border-top:2px solid var(--warn);margin:2px 0 8px 54px;position:relative}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--warn)}
.empty{color:var(--muted);font-size:.92rem;padding:8px 0 4px}
.warnline{font-size:.8rem;color:var(--warn)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-weight:600}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{color:var(--warn)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));border:0;border-radius:16px;background:var(--ink);color:var(--surface);font-weight:700;padding:14px 20px;font-size:1rem;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.modal{position:fixed;inset:0;background:rgba(10,18,24,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h3{font-family:var(--display);font-size:1.35rem;margin:0 0 10px}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px;margin-bottom:12px}
.kinds button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 6px;font-size:.85rem;font-weight:600;border-left:4px solid var(--c)}
.kinds button[aria-pressed="true"]{background:var(--cbg);border-color:var(--c)}
.f{display:grid;gap:4px;margin-bottom:10px}
.f label,.flbl{font-size:.8rem;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;min-height:42px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:.85rem;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.hint{font-size:.8rem;color:var(--muted);margin:2px 0 10px}
.acctline{display:flex;justify-content:flex-end;margin:-4px 0 10px}
.acctline button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.acctline .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.acctline button.err .dot{background:var(--warn)}
.acctform{display:grid;gap:10px}
.accterr{color:var(--warn);font-size:.88rem;min-height:1.2em;margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:10px;font-size:.9rem;z-index:60;max-width:90vw}
.c-schlaf{--c:var(--k-schlaf);--cbg:var(--k-schlaf-bg)}.c-weg{--c:var(--k-weg);--cbg:var(--k-weg-bg)}
.c-schule{--c:var(--k-schule);--cbg:var(--k-schule-bg)}.c-train{--c:var(--k-train);--cbg:var(--k-train-bg)}
.c-lernen{--c:var(--k-lernen);--cbg:var(--k-lernen-bg)}.c-frei{--c:var(--k-frei);--cbg:var(--k-frei-bg)}
.c-essen{--c:var(--k-essen);--cbg:var(--k-essen-bg)}.c-rec{--c:var(--k-rec);--cbg:var(--k-rec-bg)}
@media (max-width:420px){.nav a,.nav span{padding:6px 7px;font-size:.8rem}.brand{font-size:1.35rem}.days{gap:3px}.day{padding:5px 2px}.day b{font-size:.78rem}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><small>CZ Training</small>Planner</div>
    <div style="display:flex;gap:6px;align-items:center">
      <nav class="nav" aria-label="Bereiche"><span aria-current="page">Woche</span><a href="../training/">Training</a><a href="../">Ernährung</a></nav>
      <button class="iconbtn" id="themeBtn" type="button" aria-label="Design wechseln" title="Design"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
    </div>
  </div>

  <div class="acctline"><button type="button" id="acctBtn">Anmelden</button></div>
  <div class="seg" role="group" aria-label="Ansicht">
    <button type="button" id="vWeek" aria-pressed="true">Diese Woche</button>
    <button type="button" id="vTpl" aria-pressed="false">Standardwoche</button>
  </div>
  <p class="tplnote" id="tplNote" hidden>Die Standardwoche gilt für jede Woche. Was du hier einträgst, erscheint automatisch in allen Wochen. Änderungen nur für eine bestimmte Woche machst du unter «Diese Woche».</p>
  <div class="weekbar" id="weekBar">
    <button class="iconbtn" type="button" id="prevW" aria-label="Vorherige Woche">‹</button>
    <div class="lbl"><b id="wTitle"></b><span id="wSub"></span></div>
    <button class="iconbtn" type="button" id="nextW" aria-label="Nächste Woche">›</button>
  </div>
  <div class="days" id="days"></div>

  <section class="card" id="dayCard">
    <div class="dhead">
      <div><h2 id="dTitle"></h2><span class="dtype" id="dType"></span></div>
      <label class="sw"><input type="checkbox" id="foodSw"> Ernährung</label>
    </div>
    <div class="next" id="nextBox" hidden></div>
    <div id="timeline"></div>
    <div class="acts">
      <button class="btn" type="button" id="mealsBtn">Essen automatisch einplanen</button>
      <button class="btn" type="button" id="copyDayBtn">Tag kopieren auf …</button>
      <button class="btn" type="button" id="exampleBtn" hidden>Beispielwoche laden</button>
    </div>
  </section>
</div>
<button class="fab" type="button" id="addBtn">+ Eintrag</button>

<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const KEY="cz-planner-v1",TKEY="u15-trainingseinheit-v1",NKEY="u15-ernaehrungswoche-v2";
const DAYS=[["mo","Montag","Mo"],["di","Dienstag","Di"],["mi","Mittwoch","Mi"],["do","Donnerstag","Do"],["fr","Freitag","Fr"],["sa","Samstag","Sa"],["so","Sonntag","So"]];
/* Bausteine: Schlüssel, Name, Farbgruppe, Standarddauer (Min.) */
const KINDS=[["schule","Schule","schule",480],["arbeit","Arbeit","schule",480],["weg","Weg (Zug, Bus, Velo …)","weg",30],
 ["unihockey","Unihockeytraining","train",90],["gym","Gym (Trainingsapp)","train",60],["match","Match","train",120],["sport","Anderer Sport","train",60],
 ["lernen","Lernen","lernen",45],["frei","Freizeit","frei",60],["rec","Recovery / Physio / Sauna","rec",45],["essen","Essen","essen",20],["termin","Termin / Anderes","weg",60]];
const KBY=Object.fromEntries(KINDS.map(k=>[k[0],k]));
const MODES=[["zug","Zug"],["bus","Bus"],["tram","Tram"],["velo","Velo"],["auto","Auto"],["fuss","zu Fuss"]];
const MEALS=[["fruehstueck","Frühstück"],["znueni","Znüni"],["mittag","Mittagessen"],["vor","Zvieri / vor dem Training"],["abend","Nachtessen"],["nach","Nach-Training-Snack"]];
const TRAINK=new Set(["unihockey","gym","match","sport"]);

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const toM=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||"");return m?(+m[1])*60+(+m[2]):null};
const fmt=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const durTxt=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(r?`${h} h ${String(r).padStart(2,"0")}`:`${h} h`):`${r} Min.`};
function readJSON(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}

/* ---------- Zustand ---------- */
function blank(){const tpl={};DAYS.forEach(([d])=>tpl[d]={b:[],wake:d==="sa"||d==="so"?"08:00":"06:30",bed:d==="fr"||d==="sa"?"22:30":"21:30"});
  return {tpl,ov:{},food:true,goal:9,view:"week"}}
let state=readJSON(KEY)||blank();
state.tpl=state.tpl||blank().tpl;state.ov=state.ov||{};if(state.goal==null)state.goal=9;if(state.food==null)state.food=true;
function save(){state.upd=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}sbQueue()}

/* ---------- Datum ---------- */
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function dkey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
const today=new Date();
let wk=monday(today);let sel=(today.getDay()+6)%7;

/* ---------- Tag zusammensetzen: Standardwoche + Änderungen dieser Woche ---------- */
function dateOf(i){return addDays(wk,i)}
function ovFor(i,create){const k=dkey(dateOf(i));if(!state.ov[k]&&create)state.ov[k]={del:[],mod:{},add:[]};return state.ov[k]}
function dayData(i){const d=DAYS[i][0],t=state.tpl[d];
  if(state.view==="tpl")return {b:t.b.map(b=>Object.assign({src:"tpl"},b)),wake:t.wake,bed:t.bed};
  const o=ovFor(i);let b=t.b.filter(x=>!(o&&o.del.includes(x.id))).map(x=>Object.assign({src:"tpl"},(o&&o.mod[x.id])||x));
  if(o)b=b.concat(o.add.map(x=>Object.assign({src:"add"},x)));
  return {b,wake:(o&&o.wake)||t.wake,bed:(o&&o.bed)||t.bed}}
function sorted(b){return [...b].sort((x,y)=>(toM(x.s)??0)-(toM(y.s)??0)||(x.k==="essen")-(y.k==="essen"))}
function endM(b){const s=toM(b.s),e=toM(b.e);if(e==null)return s+(b.dur||KBY[b.k][3]);return e<=s?e+1440:e}

/* ---------- Trainingsapp ---------- */
function tstate(){return readJSON(TKEY)||{sessions:[],hist:[]}}
function sessTitle(sid){const s=(tstate().sessions||[]).find(x=>x.id===sid);return s?s.t:null}
function gymDone(sid,date){const st=tstate();return (st.hist||[]).some(h=>h.sid===sid&&dkey(new Date(h.d))===dkey(date))}
function nutMeal(i,slot){const n=readJSON(NKEY);if(!n)return "";let plan=n.plan;if(Array.isArray(n.plans)){const a=n.plans.find(p=>p.id===n.active);if(a&&a.plan)plan=a.plan}
  const d=plan&&plan[DAYS[i][0]];const v=d&&d.s&&d.s[slot];return typeof v==="string"?v:""}

/* ---------- Texte ---------- */
function title(b){if(b.k==="weg"){const m=(MODES.find(x=>x[0]===b.mode)||MODES[0])[1];return b.t||(m+(b.from||b.to?" "+[b.from,b.to].filter(Boolean).join(" – "):""))}
  if(b.k==="gym")return (sessTitle(b.sid)||b.t||"Gym-Training")+" · Gym";
  if(b.k==="essen")return (MEALS.find(m=>m[0]===b.meal)||[0,"Essen"])[1]+(b.t?": "+b.t:"");
  return b.t||KBY[b.k][1]}
function dayType(b){const tr=b.filter(x=>TRAINK.has(x.k));if(b.some(x=>x.k==="match"))return ["Matchday",""];
  const mins=tr.reduce((a,x)=>a+endM(x)-toM(x.s),0);if(!tr.length)return ["Restday (easy)","leicht"];
  if(tr.length>=2||mins>=150)return ["Trainingstag (intensiv)",""];return ["Trainingstag (normal)",""]}

/* ---------- Anzeige ---------- */
function render(){
  const tpl=state.view==="tpl";$("vWeek").setAttribute("aria-pressed",!tpl);$("vTpl").setAttribute("aria-pressed",tpl);
  $("tplNote").hidden=!tpl;$("weekBar").hidden=tpl;$("foodSw").checked=!!state.food;
  const end=addDays(wk,6);$("wTitle").textContent="Woche "+isoWeek(wk);
  const changed=DAYS.some((_,i)=>{const o=state.ov[dkey(dateOf(i))];return o&&(o.del.length||o.add.length||Object.keys(o.mod).length||o.wake||o.bed)});

  $("timeline").innerHTML=(main.length?"":`<p class="empty">${tpl?"Trag hier ein, was jede Woche gleich ist: Schule oder Arbeit, Weg dorthin, Teamtrainings.":"Noch nichts geplant. Tippe auf «+ Eintrag»."}</p>`)+h;
  $("exampleBtn").hidden=Object.values(state.tpl).some(d=>d.b.length)||Object.keys(state.ov).length>0;
  /* Als Nächstes (nur heute) */
  const nb=$("nextBox");nb.hidden=true;
  if(isToday){const up=list.filter(b=>(state.food||b.k!=="essen")&&endM(b)>nowM);const curB=up.find(b=>toM(b.s)<=nowM&&b.k!=="essen"),nxt=up.find(b=>toM(b.s)>nowM);

/* ---------- Essen automatisch einplanen ---------- */
function planMeals(){const i=sel,dd=dayData(i);const main=sorted(dd.b.filter(b=>b.k!=="essen"));
  const have=new Set(dd.b.filter(b=>b.k==="essen").map(b=>b.meal));const add=[];
  const wake=toM(dd.wake),bed=toM(dd.bed)+(toM(dd.bed)<wake?1440:0);
  const trains=main.filter(b=>TRAINK.has(b.k));const busy=main.some(b=>b.k==="schule"||b.k==="arbeit");
  const mk=(meal,m)=>{if(have.has(meal)||m<wake||m>bed-30)return;add.push({id:uid(),k:"essen",meal,s:fmt(Math.round(m/5)*5),t:nutMeal(i,meal)||undefined})};
  mk("fruehstueck",wake+15);if(busy)mk("znueni",10*60);
  const first=trains[0];const lunch=first&&toM(first.s)<14*60?Math.min(12*60,toM(first.s)-150):12*60;mk("mittag",lunch);
  if(first&&toM(first.s)>=14*60)mk("vor",toM(first.s)-90);
  const last=trains[trains.length-1];
  if(last){const e=endM(last);mk("nach",e+20);mk("abend",Math.max(e+60,18*60+30))}else mk("abend",18*60+30);
  if(!add.length){toast("Alle Mahlzeiten sind schon eingeplant.");return}
  const sc=state.view==="tpl"?"tpl":"week";add.forEach(b=>{Object.keys(b).forEach(k=>b[k]===undefined&&delete b[k]);putBlock(i,b,sc,null)});
  if(!state.food)state.food=true;save();render();toast(`${add.length} Mahlzeiten eingeplant – antippen zum Anpassen`)}

/* ---------- Wochenplan per Link übernehmen: #wp=<7 Tage, je 36 Halbstunden 06:00–24:00> ---------- */
/* Codes: S Schlafen · V Verpflegung · R Reisezeit · U Schule · A Arbeit · T Team-Training · L RLZ-Training · I Indiv.-Training · G Regeneration · H Hausaufgaben/Lernen · F Freizeit */
const WPC={R:["weg",{t:"Reisezeit",mode:"zug"}],U:["schule"],A:["arbeit"],T:["unihockey",{t:"Team-Training"}],L:["unihockey",{t:"RLZ-Training"}],I:["sport",{t:"Indiv.-Training"}],
  G:["rec",{t:"Regeneration"}],H:["lernen",{t:"Hausaufgaben / Lernen"}],F:["frei"]};
function decodeWP(str){const days=str.split(".");if(days.length!==7||days.some(d=>!/^[SVRUATLIGHF]{36}$/.test(d)))return null;
  const tpl={};days.forEach((code,i)=>{const runs=[];for(let j=0;j<36;j++){const c=code[j];if(runs.length&&runs[runs.length-1].c===c)runs[runs.length-1].n++;else runs.push({c,j,n:1})}
    const at=j=>360+j*30;const b=[];let wake=null,bed=null;
    runs.forEach((r,k)=>{if(r.c==="S"){if(k===0)wake=fmt(at(r.n));if(k===runs.length-1)bed=fmt(at(r.j));return}
      if(r.c==="V")return;const [kind,x]=WPC[r.c];b.push(Object.assign({id:uid(),k:kind,s:fmt(at(r.j)),e:fmt(at(r.j+r.n))},x||{}))});
    if(!wake)wake="06:00";if(!bed)bed="23:59";
    const trains=b.filter(x=>TRAINK.has(x.k));let first=true;
    runs.filter(r=>r.c==="V").forEach(r=>{const m=at(r.j);const afterT=trains.some(t=>{const e=toM(t.e);return m>=e&&m-e<=75});
      let meal=first&&m<=11*60?"fruehstueck":afterT?"nach":m<10*60+30?"znueni":m<14*60+30?"mittag":m<18*60?"vor":"abend";first=false;
      b.push({id:uid(),k:"essen",meal,s:fmt(m),e:fmt(at(r.j+r.n))})});
    tpl[DAYS[i][0]]={b,wake,bed}});return tpl}
function importFromHash(){const m=/[#&]wp=([A-Z.]+)/.exec(location.hash);if(!m)return;const tpl=decodeWP(m[1]);const n=/[#&]n=([^&]*)/.exec(location.hash);const name=n?decodeURIComponent(n[1]):"Wochenplan";
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
